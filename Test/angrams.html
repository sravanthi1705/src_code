<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anagram Count Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f9;
    }
    .container {
      margin-top: 80px;
      max-width: 600px;
    }
    .card {
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .anagram-list {
      margin-top: 10px;
    }
    .badge {
      margin: 3px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h3 class="text-center mb-4">🔠 Anagram Count Finder</h3>
    <div class="mb-3">
      <label for="inputString" class="form-label">Input String</label>
      <input type="text" class="form-control" id="inputString" placeholder="Enter the base string">
    </div>
    <div class="mb-3">
      <label for="searchWord" class="form-label">Word to Search</label>
      <input type="text" class="form-control" id="searchWord" placeholder="Enter word to check anagrams">
    </div>
    <div class="d-grid">
      <button class="btn btn-primary" onclick="countAnagrams()">🔍 Find Anagram Count</button>
    </div>
    <div class="mt-4 alert alert-info" id="result" style="display: none;"></div>
    <div class="anagram-list" id="anagramList" style="display: none;"></div>
  </div>
</div>

<script>
  function countAnagrams() {
    const inputString = document.getElementById('inputString').value.trim().toLowerCase();
    const word = document.getElementById('searchWord').value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');
    const anagramListDiv = document.getElementById('anagramList');

    resultDiv.style.display = 'none';
    anagramListDiv.style.display = 'none';
    anagramListDiv.innerHTML = '';

    if (!inputString || !word) {
      resultDiv.style.display = 'block';
      resultDiv.className = "alert alert-warning";
      resultDiv.textContent = "Please enter both the input string and the word.";
      return;
    }

    const wordLength = word.length;
    const sortedWord = word.split('').sort().join('');
    let count = 0;
    let anagrams = [];

    for (let i = 0; i <= inputString.length - wordLength; i++) {
      const sub = inputString.substr(i, wordLength);
      if (sub.split('').sort().join('') === sortedWord) {
        count++;
        anagrams.push(sub);
      }
    }

    resultDiv.style.display = 'block';
    resultDiv.className = "alert alert-success";
    resultDiv.textContent = `Found ${count} anagram(s) of "${word}" in the input string.`;

    if (anagrams.length > 0) {
      anagramListDiv.style.display = 'block';
      anagramListDiv.innerHTML = `<strong>Anagrams:</strong> ${anagrams.map(a => `<span class="badge bg-secondary">${a}</span>`).join(' ')}`;
    }
  }
</script>

</body>
</html>
