<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: rgb(219, 136, 163);
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      width: 80px;
      height: 80px;
      position: relative;
      perspective: 1000px;
      cursor: pointer;
    }
    .card-inner {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      backface-visibility: hidden;
    }
    .card-front {
      background-color: #0d6efd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: white;
    }
    .card-back {
      background-size: cover;
      background-position: center;
      transform: rotateY(180deg);
    }
    .matched .card-inner {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h2 class="mt-4">Memory Game</h2>

    <div class="mt-3">
      <button id="stopBtn" class="btn btn-danger">Stop Game</button>
      <button id="restartBtn" class="btn btn-primary ms-2">Restart Game</button>
    </div>

    <div class="mt-3">
      <span class="me-3"><strong>Points:</strong> <span id="points">0</span></span>
      <span class="me-3"><strong>Moves:</strong> <span id="moves">0</span></span>
      <span class="me-3"><strong>Game Time:</strong> <span id="time">0</span> sec</span>
      <span><strong>Preview Time Left:</strong> <span id="previewTime">30</span> sec</span>
    </div>

    <div class="mt-2 text-info">
      <span id="statusMsg">Preview Mode: Memorize the cards!</span>
    </div>

    <div id="game" class="game-board mt-4"></div>
  </div>

  <script>
    const gameBoard = document.getElementById("game");
    const stopBtn = document.getElementById("stopBtn");
    const restartBtn = document.getElementById("restartBtn");
    const pointsDisplay = document.getElementById("points");
    const movesDisplay = document.getElementById("moves");
    const timeDisplay = document.getElementById("time");
    const previewTimeDisplay = document.getElementById("previewTime");
    const statusMsg = document.getElementById("statusMsg");

    const images = [
      "https://picsum.photos/id/1015/100",
      "https://picsum.photos/id/1016/100",
      "https://picsum.photos/id/1018/100",
      "https://picsum.photos/id/1020/100",
      "https://picsum.photos/id/1021/100",
      "https://picsum.photos/id/1024/100",
      "https://picsum.photos/id/1025/100",
      "https://picsum.photos/id/1033/100"
    ];

    let cards = [...images, ...images];
    let flippedCards = [];
    let matchedCards = [];
    let moves = 0;
    let points = 0;
    let gameTime = 0;
    let gameInterval = null;
    let previewInterval = null;
    let gameStarted = false;
    let previewTime = 30;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function resetGame() {
      clearInterval(gameInterval);
      clearInterval(previewInterval);
      cards = shuffle([...images, ...images]);
      flippedCards = [];
      matchedCards = [];
      moves = 0;
      points = 0;
      gameTime = 0;
      gameStarted = false;
      previewTime = 30;

      pointsDisplay.textContent = points;
      movesDisplay.textContent = moves;
      timeDisplay.textContent = gameTime;
      previewTimeDisplay.textContent = previewTime;
      statusMsg.textContent = "Preview Mode: Memorize the cards!";

      createBoard();

      // Flip all cards face up for preview
      setTimeout(() => {
        document.querySelectorAll(".card").forEach(card => {
          card.classList.add("flipped");
        });

        previewInterval = setInterval(() => {
          previewTime--;
          previewTimeDisplay.textContent = previewTime;

          if (previewTime <= 0) {
            clearInterval(previewInterval);
            flipAllCardsDown();
            startGame();
          }
        }, 1000);
      }, 200);
    }

    function createBoard() {
      gameBoard.innerHTML = "";
      cards.forEach((imgSrc, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.img = imgSrc;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">❓</div>
            <div class="card-back" style="background-image: url('${imgSrc}')"></div>
          </div>
        `;

        card.addEventListener("click", () => handleFlip(card));
        gameBoard.appendChild(card);
      });
    }

    function flipAllCardsDown() {
      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("flipped");
      });
    }

    function handleFlip(card) {
      if (!gameStarted || card.classList.contains("flipped") || card.classList.contains("matched") || flippedCards.length === 2) return;

      card.classList.add("flipped");
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesDisplay.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      if (card1.dataset.img === card2.dataset.img) {
        card1.classList.add("matched");
        card2.classList.add("matched");
        points++;
        pointsDisplay.textContent = points;
        matchedCards.push(card1, card2);
        flippedCards = [];

        if (matchedCards.length === cards.length) {
          clearInterval(gameInterval);
          statusMsg.textContent = "🎉 You won!";
          setTimeout(() => alert(`🎉 You won! Moves: ${moves}, Time: ${gameTime}s`), 300);
        }
      } else {
        setTimeout(() => {
          card1.classList.remove("flipped");
          card2.classList.remove("flipped");
          flippedCards = [];
        }, 1000);
      }
    }

    function startGame() {
      gameStarted = true;
      statusMsg.textContent = "Game in progress...";
      gameInterval = setInterval(() => {
        gameTime++;
        timeDisplay.textContent = gameTime;
      }, 1000);
    }

    function stopGame() {
      clearInterval(gameInterval);
      clearInterval(previewInterval);
      gameStarted = false;
      statusMsg.textContent = "Game stopped.";
      alert("Game stopped.");
    }

    stopBtn.addEventListener("click", stopGame);
    restartBtn.addEventListener("click", resetGame);

    resetGame(); // Start the first game
  </script>
</body>
</html>
